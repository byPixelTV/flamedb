name: Pebble compatibility

on:
  pull_request:
  push:
    branches: [master, release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLAMEDB_INTEGRATION: '1'
      FLAMEDB_REFERENCE_BINARY: ${{ github.workspace }}/.compat/flamedb-reference
      FLAMEDB_PEBBLE_BINARY: ${{ github.workspace }}/.compat/flamedb-pebble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.1'
      - name: Build the frozen reference and current Pebble server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .compat/reference
          git archive a7bb892b881e59d207f79ae7258ceecdd4c63ac7 | tar -x -C .compat/reference
          (cd .compat/reference && go build -o ../flamedb-reference ./cmd/flamedb)
          go build -o .compat/flamedb-pebble ./cmd/flamedb
          chmod +x pkg/kotlin/gradlew
      - name: Install the locked TypeScript toolchain
        working-directory: pkg/typescript
        run: npm ci
      - name: Server and database integration with race detector
        run: node internal/compat/check-release.cjs
      - name: Static analysis and SDK regressions
        shell: bash
        run: |
          set -euo pipefail
          (cd pkg/go && go test -race ./... && go vet ./...)
          (cd pkg/typescript && npm test && bun test && node ../../internal/compat/sdk/bun-wire.cjs)
          (cd pkg/kotlin && ./gradlew test --no-daemon --console=plain)
          (cd grafana && go test ./...)
