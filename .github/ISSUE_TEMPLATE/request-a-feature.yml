name: 👷 Feature Request
description: Request an addition or change to FlameDB
title: "[SUGGESTION]"
body:
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: What would you like to see improved?
      placeholder: |
        The more details, the better
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe alternatives you've considered
      placeholder: |
        The more details, the better
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any additional information that may help us out.
      placeholder: |
        Ex: "I know that you can do x with y to make it work, maybe take a look at that?"
    validations:
      required: false